[project]
name = "kioku"
version = "0.0.1"
description = "Private agentic personal assistant — cloud brain, local hands."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2,<0.3",   # tested against 0.2.x; the permission-callback API is required
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "celery>=5.4",
    "redis>=5.0",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-telegram-bot>=21.6",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "langfuse>=2.50,<3",   # code uses the v2 tracing surface (_lf.trace); v3 dropped it
    "python-frontmatter>=1.1",
    "PyYAML>=6.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9",   # only needed if you enable the db poller
]

[project.optional-dependencies]
# Local embeddings pull torch (~2GB) — keep them OUT of the default image. The deploy
# doc warns torch-on-Railway ~triples the bill, and EMBEDDING_BACKEND defaults to "none".
# Install only where you actually run the local model:  pip install -e .[local-embeddings]
local-embeddings = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "fakeredis>=2.26",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
kioku = "kioku.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real Postgres (pgvector) and Redis — see tests/README.md",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["kioku"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["mockups"]

[tool.ruff.lint]
select = ["E9", "F", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "SIM108", "B904", "UP035"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query"]   # FastAPI's idiom

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true
# Typed core: the budget guard, the vault, approvals and the gate, retrieval, routing, the API.
# Widen this list as modules get annotations.
files = [
    "src/kioku/config.py",
    "src/kioku/memory/budget.py",
    "src/kioku/memory/vault.py",
    "src/kioku/memory/approvals.py",
    "src/kioku/memory/retrieval.py",
    "src/kioku/memory/index.py",
    "src/kioku/agent/router.py",
    "src/kioku/agent/gate.py",
    "src/kioku/agent/usage.py",
    "src/kioku/agent/toolsets.py",
    "src/kioku/agent/prompts.py",
    "src/kioku/agent/orchestrator.py",
    "src/kioku/api/main.py",
]
