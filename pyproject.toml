[project]
name = "kioku"
version = "0.0.1"
description = "Private agentic personal assistant — cloud brain, local hands."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.0",   # pin & verify signatures against installed version
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "celery>=5.4",
    "redis>=5.0",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-telegram-bot>=21.6",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "langfuse>=2.50,<3",   # code uses the v2 tracing surface (_lf.trace); v3 dropped it
    "python-frontmatter>=1.1",
    "PyYAML>=6.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9",   # only needed if you enable the db poller
]

[project.optional-dependencies]
# Local embeddings pull torch (~2GB) — keep them OUT of the default image. The deploy
# doc warns torch-on-Railway ~triples the bill, and EMBEDDING_BACKEND defaults to "none".
# Install only where you actually run the local model:  pip install -e .[local-embeddings]
local-embeddings = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
kioku = "kioku.cli:main"
